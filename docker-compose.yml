version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: peeripo
      POSTGRES_PASSWORD: peeripo
      POSTGRES_DB: peeripo
    ports:
      - "5432:5432"
    volumes:
      - peeripo_db:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./screenshots:/app/screenshots
    command: python -m worker.scheduler

  screenshot-watcher:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./screenshots:/app/screenshots
    command: python -m worker.screenshot_watcher

volumes:
  peeripo_db:
